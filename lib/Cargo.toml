[package]
name = "wallie-lib"
version = "0.1.0-unstable.0"
edition.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
name = "wallie_lib"
crate-type = ["lib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde", "now"] }
interprocess = { version = "2.4.6", default-features = false }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
